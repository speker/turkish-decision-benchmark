[project]
name = "turkish-decision-benchmark"
version = "1.1.0"
description = "Turkish Decision Benchmark: generator, jury pipeline, scorer and harness"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub==2.4.0",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 110
target-version = "py312"
